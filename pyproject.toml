[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitcontext"
version = "0.1.0"
description = "Codebase intelligence & developer copilot: hybrid RAG over code, docs, commits, PRs and incidents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "qdrant-client>=1.10",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.26",
]

[project.optional-dependencies]
local = ["fastembed>=0.3"]            # local ONNX embeddings + cross-encoder (default provider)
server = ["uvicorn[standard]>=0.29"]  # `gitcontext serve`
ui = ["streamlit>=1.33"]              # `gitcontext ui`
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
dev = ["pytest>=8", "ruff>=0.4", "pyyaml>=6"]
all = ["gitcontext[local,server,ui,anthropic,openai]"]

[project.scripts]
gitcontext = "gitcontext.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gitcontext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E731", "E741"]


