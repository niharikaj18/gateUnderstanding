# Render blueprint for the GitContext backend (the Vercel frontend proxies to this).
# NOTE: written from Render's documented schema but NOT deployed/tested by the author.
# Persistent disks need a paid instance type; the local ONNX embedding model needs ~1-2 GB RAM.
services:
  - type: web
    name: gitcontext-api
    runtime: docker
    plan: standard
    healthCheckPath: /health
    disk:
      name: gitcontext-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: GITCONTEXT_REPO            # e.g. https://github.com/owner/name
        sync: false
      - key: GITCONTEXT_API_KEY         # copy this value into Vercel as BACKEND_API_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN               # PRs/issues/incidents + private repos
        sync: false
      - key: GITCONTEXT_AUTO_INDEX_ON_START
        value: "true"
      - key: GITCONTEXT_AUTO_SYNC_SECONDS
        value: "300"
      - key: GITCONTEXT_RERANKER        # measured: no gain on our benchmark, costs seconds per query
        value: none
